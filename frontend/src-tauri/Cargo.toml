[package]
name = "xinyu-app"
version = "0.4.9"
description = "心愈 · 心理健康服务平台桌面端"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
base64 = "0.22"
# 检查更新：HTTP 请求（Gitee Releases API）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# 任务栏闪烁提醒（QQ 式新消息）：调用 Win32 FlashWindowEx；
# 缩略图消息卡片：DWM 图标位图 + GDI 文字渲染 + 窗口子类化
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

# macOS 适配：透明托盘悬浮卡片窗口（macos-private-api）、Dock 角标与图标弹跳
# （AppKit）、托盘角标图缩放到菜单栏尺寸（image）
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
