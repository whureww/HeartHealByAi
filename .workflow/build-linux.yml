# ============================================================
# Gitee Go 流水线：构建 Linux 安装包（.deb / .AppImage）
#
# 使用前：
# 1. 在 Gitee 仓库 → 服务 → Gitee Go 中开通并创建流水线
# 2. 选择"导入 YAML"或直接粘贴此文件内容
# 3. Runner 选择 Ubuntu 22.04（或更高版本）
# 4. 如需发布到 Gitee Releases，在 Gitee Go 可视化界面添加
#    "Release" 插件步骤
# ============================================================

displayName: 构建 Linux 安装包

triggers:
  push:
    - matchType: PRECISE
      branch: master
    - matchType: PRECISE
      tag: v*

stages:
  - stage:
      name: build
      displayName: 构建
      strategy: naturally
      trigger: auto
      tasks:
        - task:
            name: build-deb
            displayName: 编译 .deb / .AppImage
            # Runner 镜像：Ubuntu 22.04
            image: ubuntu:22.04
            shell: |
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 1. 系统依赖
              apt-get update
              apt-get install -y \
                libwebkit2gtk-4.1-dev \
                build-essential \
                curl \
                wget \
                file \
                libssl-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                git \
                pkg-config

              # 2. Node.js 20
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs

              # 3. Rust
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env

              # 4. 前端依赖与构建
              cd frontend
              npm ci
              npm run build

              # 5. Tauri 打包
              npx tauri build --bundles deb,appimage

              # 6. 产物路径
              echo "=== 构建完成 ==="
              find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \)
