<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="958" viewBox="0 0 1240 958" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
  </marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
  </marker>
</defs>
<rect x="0" y="0" width="1240" height="958" fill="#ffffff"/>
<text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">认证与会话时序：登录 · 请求鉴权 · 登出</text><text x="32" y="70" font-size="13" fill="#64748b">JWT + Redis 实现无状态鉴权与单点登录（新登录踢掉旧会话）</text><rect x="45" y="90" width="150" height="34" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="120" y="112" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">用户 / 客户端</text><line x1="120" y1="124" x2="120" y2="918" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="285" y="90" width="150" height="34" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="360" y="112" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">前端 Vue</text><line x1="360" y1="124" x2="360" y2="918" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="545" y="90" width="150" height="34" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="620" y="112" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">后端 Express</text><line x1="620" y1="124" x2="620" y2="918" stroke="#059669" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="805" y="90" width="150" height="34" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="880" y="112" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Redis</text><line x1="880" y1="124" x2="880" y2="918" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="1045" y="90" width="150" height="34" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="1120" y="112" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">MySQL</text><line x1="1120" y1="124" x2="1120" y2="918" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="60" y="128" width="1120" height="26" rx="6" fill="#e2e8f0"/>
<text x="74" y="146" font-size="13" font-weight="700" fill="#334155">① 登录（POST /api/users/login）</text><line x1="120" y1="178" x2="360" y2="178" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="187.1" y="153" width="105.8" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="240" y="168" font-size="12" fill="#1e293b" text-anchor="middle">输入邮箱 + 密码</text><line x1="360" y1="216" x2="620" y2="216" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="370.80000000000007" y="191" width="238.39999999999986" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="490" y="206" font-size="12" fill="#1e293b" text-anchor="middle">POST /users/login {email,password}</text><line x1="620" y1="254" x2="1120" y2="254" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="754.1" y="229" width="231.79999999999987" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="870" y="244" font-size="12" fill="#1e293b" text-anchor="middle">SELECT * FROM users WHERE email=?</text><line x1="1120" y1="292" x2="620" y2="292" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="786.8000000000001" y="267" width="166.39999999999992" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="870" y="282" font-size="12" fill="#1e293b" text-anchor="middle">返回用户与 password_hash</text><rect x="540" y="308" width="160" height="40" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/><text x="620" y="328" font-size="11.5" fill="#991b1b" text-anchor="middle">bcrypt.compare 校验</text><text x="620" y="345" font-size="11.5" fill="#991b1b" text-anchor="middle">失败返回 401</text><line x1="620" y1="372" x2="880" y2="372" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowRed)"/><rect x="605.9000000000001" y="347" width="288.19999999999993" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="750" y="362" font-size="12" fill="#1e293b" text-anchor="middle">删旧 user_onlyid / onlyid_token（踢旧登录）</text><line x1="620" y1="410" x2="880" y2="410" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="643.4000000000001" y="385" width="213.19999999999993" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="750" y="400" font-size="12" fill="#1e293b" text-anchor="middle">写会话三键（TTL 7 天）+ 签发 JWT</text><line x1="620" y1="448" x2="360" y2="448" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/><rect x="420.3" y="423" width="139.39999999999995" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="490" y="438" font-size="12" fill="#1e293b" text-anchor="middle">200 { token, user }</text><rect x="280" y="464" width="160" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/><text x="360" y="484" font-size="11.5" fill="#1e3a8a" text-anchor="middle">内存/加密存储 token</text><text x="360" y="501" font-size="11.5" fill="#1e3a8a" text-anchor="middle">后续请求放入请求头</text><rect x="60" y="520" width="1120" height="26" rx="6" fill="#e2e8f0"/>
<text x="74" y="538" font-size="13" font-weight="700" fill="#334155">② 已登录请求（auth 中间件）</text><line x1="360" y1="572" x2="620" y2="572" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="387.30000000000007" y="547" width="205.3999999999999" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="490" y="562" font-size="12" fill="#1e293b" text-anchor="middle">Authorization: Bearer &lt;token&gt;</text><line x1="620" y1="610" x2="880" y2="610" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="639.2" y="585" width="221.5999999999999" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="750" y="600" font-size="12" fill="#1e293b" text-anchor="middle">查 token_blacklist + 比对 onlyid</text><line x1="880" y1="648" x2="620" y2="648" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="719" y="623" width="62" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="750" y="638" font-size="12" fill="#1e293b" text-anchor="middle">校验通过</text><rect x="540" y="664" width="160" height="36" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/><text x="620" y="684" font-size="11.5" fill="#991b1b" text-anchor="middle">黑名单/单点不符 → 401</text><line x1="620" y1="720" x2="1120" y2="720" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="827" y="695" width="86" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="870" y="710" font-size="12" fill="#1e293b" text-anchor="middle">执行业务查询</text><line x1="620" y1="758" x2="360" y2="758" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/><rect x="439.2" y="733" width="101.6" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="490" y="748" font-size="12" fill="#1e293b" text-anchor="middle">200 + 业务数据</text><rect x="60" y="790" width="1120" height="26" rx="6" fill="#e2e8f0"/>
<text x="74" y="808" font-size="13" font-weight="700" fill="#334155">③ 登出（POST /api/users/logout）</text><line x1="360" y1="838" x2="620" y2="838" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="385.80000000000007" y="813" width="208.39999999999992" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="490" y="828" font-size="12" fill="#1e293b" text-anchor="middle">POST /users/logout（带 token）</text><line x1="620" y1="876" x2="880" y2="876" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowRed)"/><rect x="653.3" y="851" width="193.39999999999998" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="750" y="866" font-size="12" fill="#1e293b" text-anchor="middle">token 入黑名单 + 删除会话三键</text><line x1="620" y1="912" x2="360" y2="912" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/><rect x="379.20000000000005" y="887" width="221.5999999999999" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="490" y="902" font-size="12" fill="#1e293b" text-anchor="middle">Socket force-logout 踢下线 · 200</text>
</svg>