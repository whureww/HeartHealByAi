<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
  </marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
  </marker>
</defs>
<rect x="0" y="0" width="1240" height="786" fill="#ffffff"/>
<text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">聊天内容三级审核流程</text><text x="32" y="70" font-size="13" fill="#64748b">前端毫秒预检 → 服务端词库秒级拦截 → AI 结合上下文复核；命中即不入库</text><rect x="470" y="86" width="300" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="620" y="114" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">用户输入聊天消息</text><line x1="620" y1="132" x2="620" y2="152" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="220" y="156" width="800" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="620" y="178" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">① 前端预检  POST /moderation/precheck</text><text x="232" y="200" font-size="12.5" fill="#334155">浏览器端内存敏感词库，毫秒级匹配；命中直接标红拦截，请求根本不发出</text><rect x="220" y="268" width="800" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="620" y="290" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">② 服务端词库二次校验（send-message 内）</text><text x="232" y="312" font-size="12.5" fill="#334155">启动时从 sensitive_words 加载内存；主词「包含匹配」+ 缩写短词「独立词边界匹配」，拦截绕过前端的请求</text><rect x="220" y="380" width="800" height="84" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="620" y="402" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">③ AI 上下文复核  checkMessageContentAI</text><text x="232" y="424" font-size="12.5" fill="#334155">取该会话最近 6 条消息作为上下文，交大模型识别隐晦表达、变体、缩写与真实意图</text><line x1="620" y1="240" x2="620" y2="266" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><line x1="620" y1="352" x2="620" y2="378" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><line x1="620" y1="464" x2="620" y2="482" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><polygon points="620,484 710,518 620,552 530,518" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="620" y="522" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">是否合规？</text><path d="M530,518 L300,518 L300,580" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowGreen)"/><text x="306" y="512" font-size="12" fill="#475569">合规</text><rect x="150" y="580" width="300" height="82" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="300" y="602" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">入库并投递</text><text x="162" y="624" font-size="11.5" fill="#334155">INSERT expert_chat</text><text x="162" y="640.5" font-size="11.5" fill="#334155">广播 new-message</text><text x="162" y="657" font-size="11.5" fill="#334155">未读 chat-notification</text><path d="M710,518 L940,518 L940,580" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowRed)"/><text x="946" y="512" font-size="12" fill="#475569">违规</text><rect x="790" y="580" width="300" height="82" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="940" y="602" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">拦截不入库</text><text x="802" y="624" font-size="11.5" fill="#334155">返回警告提示</text><text x="802" y="640.5" font-size="11.5" fill="#334155">严重（自伤/违法）</text><text x="802" y="657" font-size="11.5" fill="#334155">force-logout 强制下线</text><rect x="60" y="688" width="520" height="76" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3"/><text x="320" y="708" font-size="11.5" fill="#92400e" text-anchor="middle">词库维护（管理员）：/admin/sensitive-words 增删词</text><text x="320" y="725" font-size="11.5" fill="#92400e" text-anchor="middle">保存后调用 invalidateWords() 实时失效重载，无需重启服务</text><text x="320" y="742" font-size="11.5" fill="#92400e" text-anchor="middle">表为空时自动播种内置默认词库（侮辱/色情/违禁/自伤/缩写）</text>
</svg>