<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
  </marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
  </marker>
</defs>
<rect x="0" y="0" width="1240" height="590" fill="#ffffff"/>
<text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">CI/CD 多平台打包与双端发布流程</text><text x="32" y="70" font-size="13" fill="#64748b">推送 tag 触发 GitHub Actions 矩阵构建，产物汇总到 GitHub Release 后经 Gitee API 同步</text><rect x="40" y="150" width="180" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="130" y="172" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">推送版本 tag</text><text x="52" y="194" font-size="11.5" fill="#334155">git push github</text><text x="52" y="210.5" font-size="11.5" fill="#334155">--tags（v*）</text><text x="52" y="227" font-size="11.5" fill="#334155">如 v0.3.0_UpDate</text><line x1="220" y1="190" x2="260" y2="190" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="260" y="130" width="200" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="360" y="152" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">GitHub Actions</text><text x="272" y="174" font-size="11" fill="#334155">release.yml</text><text x="272" y="190" font-size="11" fill="#334155">on: push tags v*</text><text x="272" y="206" font-size="11" fill="#334155">actions/checkout</text><text x="272" y="222" font-size="11" fill="#334155">pnpm/setup-node</text><text x="272" y="238" font-size="11" fill="#334155">tauri-apps/tauri-action</text><line x1="460" y1="190" x2="500" y2="190" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="500" y="96" width="420" height="210" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.55"/>
<text x="514" y="120" font-size="14" font-weight="700" fill="#059669">构建矩阵（每个目标独立 runner）</text><rect x="516" y="130" width="188" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="152" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">macos-latest</text><text x="528" y="174" font-size="10.8" fill="#334155">x86_64-apple-darwin</text><text x="528" y="189.8" font-size="10.8" fill="#334155">aarch64-apple-darwin</text><text x="528" y="205.6" font-size="10.8" fill="#334155">产物 .app / .dmg</text><rect x="716" y="130" width="188" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="810" y="152" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">ubuntu-22.04</text><text x="728" y="174" font-size="10.8" fill="#334155">x86_64-unknown-linux-gnu</text><text x="728" y="189.8" font-size="10.8" fill="#334155">aarch64-unknown-linux-gnu</text><text x="728" y="205.6" font-size="10.8" fill="#334155">产物 .AppImage/.deb</text><rect x="516" y="216" width="388" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="710" y="238" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">每作业：pnpm install → tauri build</text><text x="528" y="260" font-size="11" fill="#334155">Rust 按 --target 编译；bundle.targets=all</text><text x="528" y="276" font-size="11" fill="#334155">Tauri 不支持跨 OS，macOS 包必须 macOS runner</text><line x1="920" y1="190" x2="960" y2="190" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="960" y="140" width="240" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="1080" y="162" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">GitHub Release</text><text x="972" y="184" font-size="11.5" fill="#334155">tauri-action 汇总</text><text x="972" y="200.5" font-size="11.5" fill="#334155">各平台安装包</text><text x="972" y="217" font-size="11.5" fill="#334155">创建草稿 Release</text><text x="972" y="233.5" font-size="11.5" fill="#334155">附带 release notes</text><path d="M1080,240 L1080,330 L260,330 L260,360" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowAmber)"/><rect x="140" y="360" width="240" height="92" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="260" y="382" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">同步作业（Gitee API）</text><text x="152" y="404" font-size="11" fill="#334155">下载 GitHub 产物</text><text x="152" y="420" font-size="11" fill="#334155">GITEE_TOKEN 鉴权</text><text x="152" y="436" font-size="11" fill="#334155">创建 Gitee Release</text><text x="152" y="452" font-size="11" fill="#334155">回传同名附件</text><line x1="380" y1="406" x2="440" y2="406" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="440" y="366" width="240" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="560" y="388" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Gitee Releases</text><text x="452" y="410" font-size="11.5" fill="#334155">源码 + 多平台安装包</text><text x="452" y="426.5" font-size="11.5" fill="#334155">tag 与 Release 对齐</text><rect x="720" y="360" width="480" height="150" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/><text x="960" y="380" font-size="11.5" fill="#991b1b" text-anchor="middle">平台覆盖说明 / 现状</text><text x="960" y="397" font-size="11.5" fill="#991b1b" text-anchor="middle">· Windows：本机用 Inno Setup 产出 .exe（也可加 windows-latest 矩阵）</text><text x="960" y="414" font-size="11.5" fill="#991b1b" text-anchor="middle">· macOS：.dmg 只能由 macOS runner 构建，无法跨 OS 编译</text><text x="960" y="431" font-size="11.5" fill="#991b1b" text-anchor="middle">· Linux x64/arm64：ubuntu runner 构建；arm64 在 x64 上需交叉/模拟</text><text x="960" y="448" font-size="11.5" fill="#991b1b" text-anchor="middle">· RISC-V / armv7：官方 runner 无原生支持，需 QEMU + 交叉工具链</text><text x="960" y="465" font-size="11.5" fill="#991b1b" text-anchor="middle">· Gitee Go 需在网页开通后才能作为替代构建源</text><rect x="140" y="490" width="1060" height="64" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3"/><text x="670" y="510" font-size="11.5" fill="#92400e" text-anchor="middle">当前状态：GitHub Actions 免费额度一度耗尽，跨平台产物待额度恢复后由本流水线自动生成；脚本与矩阵已就绪，重跑 tag 即可出包。</text><text x="670" y="527" font-size="11.5" fill="#92400e" text-anchor="middle">密钥：GITEE_TOKEN 存于 GitHub Secrets；workflow 用 shell 判空决定是否同步，未配置时仅发布到 GitHub。</text>
</svg>