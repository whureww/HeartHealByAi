<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
  </marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
  </marker>
</defs>
<rect x="0" y="0" width="1240" height="800" fill="#ffffff"/>
<text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">AI 对话时序：普通请求 / SSE 流式 / 聊天落库</text><text x="32" y="70" font-size="13" fill="#64748b">/ai/chat 与 /ai/chat-stream 本身不写库，内容由前端另调 /users/chat 持久化</text><rect x="45" y="90" width="150" height="34" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="120" y="112" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">用户</text><line x1="120" y1="124" x2="120" y2="788" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="275" y="90" width="150" height="34" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="350" y="112" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">前端 Vue</text><line x1="350" y1="124" x2="350" y2="788" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="545" y="90" width="150" height="34" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="620" y="112" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">后端 /ai</text><line x1="620" y1="124" x2="620" y2="788" stroke="#059669" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="825" y="90" width="150" height="34" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="900" y="112" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">外部大模型 API</text><line x1="900" y1="124" x2="900" y2="788" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="1045" y="90" width="150" height="34" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="1120" y="112" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">MySQL</text><line x1="1120" y1="124" x2="1120" y2="788" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="60" y="128" width="1120" height="26" rx="6" fill="#e2e8f0"/>
<text x="74" y="146" font-size="13" font-weight="700" fill="#334155">① 普通问答：POST /api/ai/chat（一次性返回）</text><line x1="350" y1="176" x2="620" y2="176" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="375.70000000000005" y="151" width="218.59999999999988" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="485" y="166" font-size="12" fill="#1e293b" text-anchor="middle">POST /ai/chat {message,history}</text><line x1="620" y1="214" x2="900" y2="214" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="650.4000000000001" y="189" width="219.19999999999993" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="760" y="204" font-size="12" fill="#1e293b" text-anchor="middle">POST /chat/completions（非流式）</text><line x1="900" y1="252" x2="620" y2="252" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="653.1" y="227" width="213.79999999999993" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="760" y="242" font-size="12" fill="#1e293b" text-anchor="middle">完整 choices[0].message（JSON）</text><line x1="620" y1="290" x2="350" y2="290" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/><rect x="435.1" y="265" width="99.79999999999998" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="485" y="280" font-size="12" fill="#1e293b" text-anchor="middle">200 { reply }</text><rect x="60" y="320" width="1120" height="26" rx="6" fill="#e2e8f0"/>
<text x="74" y="338" font-size="13" font-weight="700" fill="#334155">② 流式问答：POST /api/ai/chat-stream（SSE 逐字推送）</text><line x1="350" y1="368" x2="620" y2="368" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="412" y="343" width="145.99999999999994" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="485" y="358" font-size="12" fill="#1e293b" text-anchor="middle">POST /ai/chat-stream</text><line x1="620" y1="406" x2="900" y2="406" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="640.8000000000001" y="381" width="238.39999999999986" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="760" y="396" font-size="12" fill="#1e293b" text-anchor="middle">POST /chat/completions stream:true</text><line x1="900" y1="444" x2="620" y2="444" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="633.9000000000001" y="419" width="252.1999999999999" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="760" y="434" font-size="12" fill="#1e293b" text-anchor="middle">多个 data: {choices:[{delta}]} 数据块</text><line x1="620" y1="482" x2="350" y2="482" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowGreen)"/><rect x="403.3" y="457" width="163.39999999999995" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="485" y="472" font-size="12" fill="#1e293b" text-anchor="middle">res.write SSE data 逐块</text><line x1="620" y1="520" x2="350" y2="520" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowGreen)"/><rect x="418.90000000000003" y="495" width="132.19999999999996" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="485" y="510" font-size="12" fill="#1e293b" text-anchor="middle">持续推送直到 [DONE]</text><rect x="270" y="536" width="160" height="36" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/><text x="350" y="556" font-size="11.5" fill="#1e3a8a" text-anchor="middle">onmessage 累加 delta</text><text x="350" y="573" font-size="11.5" fill="#1e3a8a" text-anchor="middle">界面逐字渲染</text><rect x="60" y="586" width="1120" height="26" rx="6" fill="#e2e8f0"/>
<text x="74" y="604" font-size="13" font-weight="700" fill="#334155">③ 聊天记录落库（前端主动持久化）</text><line x1="350" y1="634" x2="620" y2="634" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="357.40000000000003" y="609" width="255.19999999999993" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="485" y="624" font-size="12" fill="#1e293b" text-anchor="middle">POST /users/chat（用户消息 + AI 回复）</text><line x1="620" y1="672" x2="1120" y2="672" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowAmber)"/><rect x="742.1" y="647" width="255.79999999999987" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="870" y="662" font-size="12" fill="#1e293b" text-anchor="middle">INSERT chat_records（type=user / ai）</text><line x1="620" y1="710" x2="350" y2="710" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/><rect x="428.5" y="685" width="112.99999999999997" height="20" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="485" y="700" font-size="12" fill="#1e293b" text-anchor="middle">200 { success }</text><rect x="530" y="726" width="180" height="44" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3"/><text x="620" y="746" font-size="11.5" fill="#92400e" text-anchor="middle">AI 接口不落库；</text><text x="620" y="763" font-size="11.5" fill="#92400e" text-anchor="middle">报告走 /users/analysis-report</text><text x="620" y="780" font-size="11.5" fill="#92400e" text-anchor="middle">写入 analysis_reports</text>
</svg>