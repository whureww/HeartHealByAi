<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
  </marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
  </marker>
</defs>
<rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
<text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">预约与专家实时聊天流程</text><text x="32" y="70" font-size="13" fill="#64748b">预约状态机 + Socket.IO 房间消息；消息经三级审核后入库并广播</text><rect x="60" y="86" width="280" height="800" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/><text x="200" y="110" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">普通用户</text><rect x="440" y="86" width="280" height="800" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/><text x="620" y="110" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">服务端（Express + Socket.IO）</text><rect x="900" y="86" width="280" height="800" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/><text x="1040" y="110" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">专家</text><rect x="60" y="128" width="280" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="200" y="150" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">选择专家 · 提交预约</text><text x="72" y="172" font-size="11.5" fill="#334155">POST /users/appointments</text><rect x="480" y="128" width="280" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="620" y="150" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">校验 + 去重，创建预约</text><text x="492" y="172" font-size="11.5" fill="#334155">INSERT appointment_records</text><text x="492" y="188.5" font-size="11.5" fill="#334155">status = pending</text><rect x="900" y="128" width="280" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1040" y="150" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">收到预约通知</text><text x="912" y="172" font-size="11.5" fill="#334155">appointment-updated 推送</text><rect x="900" y="224" width="280" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1040" y="246" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">确认 / 拒绝预约</text><text x="912" y="268" font-size="11.5" fill="#334155">PUT /expert/appointments/:id/status</text><text x="912" y="284.5" font-size="11.5" fill="#334155">confirmed / rejected</text><rect x="480" y="224" width="280" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="620" y="246" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">更新状态并广播</text><text x="492" y="268" font-size="11.5" fill="#334155">UPDATE status</text><text x="492" y="284.5" font-size="11.5" fill="#334155">拒绝→流程结束</text><rect x="200" y="320" width="280" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/><text x="340" y="342" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">双方加入预约房间</text><text x="212" y="364" font-size="11.5" fill="#334155">Socket join-room</text><rect x="60" y="400" width="280" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="200" y="422" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">发送消息</text><text x="72" y="444" font-size="11.5" fill="#334155">send-message 事件</text><rect x="480" y="400" width="280" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="620" y="422" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">三级审核 + 重算身份</text><text x="492" y="444" font-size="11.5" fill="#334155">词库匹配 → AI 上下文复核</text><text x="492" y="460.5" font-size="11.5" fill="#334155">服务端推导 receiver_id</text><rect x="480" y="496" width="280" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="620" y="518" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">入库并广播</text><text x="492" y="540" font-size="11.5" fill="#334155">INSERT expert_chat</text><text x="492" y="556.5" font-size="11.5" fill="#334155">emit new-message</text><rect x="900" y="496" width="280" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/><text x="1040" y="518" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">收到新消息 / 未读提醒</text><text x="912" y="540" font-size="11.5" fill="#334155">chat-notification</text><rect x="900" y="592" width="280" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/><text x="1040" y="614" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">打开会话 · 标记已读</text><text x="912" y="636" font-size="11.5" fill="#334155">mark-read 事件</text><rect x="480" y="592" width="280" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="620" y="614" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">更新已读并广播</text><text x="492" y="636" font-size="11.5" fill="#334155">UPDATE is_read=1</text><rect x="900" y="688" width="280" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1040" y="710" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">完成咨询</text><text x="912" y="732" font-size="11.5" fill="#334155">status = completed</text><rect x="480" y="688" width="280" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="620" y="710" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">归档预约</text><text x="492" y="732" font-size="11.5" fill="#334155">UPDATE status 广播</text><rect x="60" y="688" width="280" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="200" y="710" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">查看历史 / 档案</text><text x="72" y="732" font-size="11.5" fill="#334155">GET /expert/appointments/:id</text><path d="M340,160 L480,160" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M760,160 L900,160" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1040,192 L1040,224" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M900,256 L760,256" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowGreen)"/><path d="M480,256 L400,256 L400,320 L200,320 L200,352" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowGreen)"/><text x="406" y="314" font-size="12" fill="#475569">confirmed</text><path d="M200,384 L200,400" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M340,432 L480,432" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowRed)"/><path d="M760,528 L900,528" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowGreen)"/><path d="M900,624 L760,624" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M1040,672 L1040,688" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M900,720 L760,720" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M480,720 L340,720" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="60" y="800" width="1040" height="70" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/><text x="580" y="820" font-size="11.5" fill="#991b1b" text-anchor="middle">预约状态机：pending（待确认）→ confirmed（已确认）→ completed（已完成）；任意阶段可 rejected（已拒绝）/ cancelled（用户取消）</text><text x="580" y="837" font-size="11.5" fill="#991b1b" text-anchor="middle">强制规则：接收方由服务端按预约参与方推导，禁止前端伪造；非 confirmed 不能进入咨询；非参与方不能收发消息</text>
</svg>