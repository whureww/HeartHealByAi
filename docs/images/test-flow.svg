<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="884" viewBox="0 0 1240 884" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
  </marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
  </marker>
</defs>
<rect x="0" y="0" width="1240" height="884" fill="#ffffff"/>
<text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">心理测评流程：固定量表计分 vs AI 智能测评</text><text x="32" y="70" font-size="13" fill="#64748b">两条路径最终都写入 test_results；AI 路径额外落 ai_test_papers 并 upsert AI-GEN 量表</text><rect x="470" y="86" width="300" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="620" y="115" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">进入测评中心</text><line x1="620" y1="134" x2="620" y2="152" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><polygon points="620,152 720,188 620,224 520,188" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="620" y="192" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">选择测评方式</text><text x="470" y="180" font-size="12" font-weight="700" fill="#059669">固定量表</text><text x="720" y="180" font-size="12" font-weight="700" fill="#7c3aed">AI 智能测评</text><rect x="100" y="250" width="300" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="250" y="272" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">GET /tests/list 拉取上架量表</text><text x="112" y="294" font-size="11.5" fill="#334155">仅 status=1 且 code≠AI-GEN</text><rect x="100" y="342" width="300" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="250" y="364" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">GET /tests/questions/:id</text><text x="112" y="386" font-size="11.5" fill="#334155">量表 + 题目/选项 JSON</text><line x1="250" y1="314" x2="250" y2="342" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="100" y="434" width="300" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="250" y="462" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">前端逐题作答</text><line x1="250" y1="406" x2="250" y2="434" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="100" y="526" width="300" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="250" y="548" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">POST /tests/submit</text><text x="112" y="570" font-size="11.5" fill="#334155">{testId, answers}</text><line x1="250" y1="498" x2="250" y2="526" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="100" y="618" width="300" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="250" y="640" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">服务端规则计分</text><text x="112" y="662" font-size="11.5" fill="#334155">sum 求和 · 反向计分</text><text x="112" y="678.5" font-size="11.5" fill="#334155">按 result_levels 匹配分级</text><line x1="250" y1="590" x2="250" y2="618" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M520,188 L250,188 L250,250" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowGreen)"/><rect x="840" y="250" width="300" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="990" y="272" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">POST /tests/ai/questions</text><text x="852" y="294" font-size="11.5" fill="#334155">{symptoms} 描述症状，AI 出题</text><rect x="840" y="342" width="300" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="990" y="364" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">写 ai_test_papers</text><text x="852" y="386" font-size="11.5" fill="#334155">题目落库，返回 paper_id</text><line x1="990" y1="314" x2="990" y2="342" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="840" y="434" width="300" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="990" y="462" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">前端逐题作答</text><line x1="990" y1="406" x2="990" y2="434" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="840" y="526" width="300" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="990" y="548" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">POST /tests/ai/submit</text><text x="852" y="570" font-size="11.5" fill="#334155">{paperId, answers}</text><line x1="990" y1="498" x2="990" y2="526" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="840" y="618" width="300" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="990" y="640" font-size="12.5" font-weight="700" fill="#374151" text-anchor="middle">取回问卷 + AI 评分</text><text x="852" y="662" font-size="11.5" fill="#334155">调大模型打分给结论</text><text x="852" y="678.5" font-size="11.5" fill="#334155">upsert 量表 code=AI-GEN</text><line x1="990" y1="590" x2="990" y2="618" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M720,188 L990,188 L990,250" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M250,710 L250,740 L620,740" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowAmber)"/><path d="M990,710 L990,740 L620,740" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrowAmber)"/><rect x="470" y="740" width="300" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="620" y="762" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">写入 test_results</text><text x="482" y="784" font-size="11.5" fill="#334155">总分 / 分级 / 结果描述</text><line x1="620" y1="796" x2="620" y2="814" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="430" y="814" width="380" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="620" y="836" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">查看结果与历史</text><text x="442" y="858" font-size="11.5" fill="#334155">GET /tests/history · /result/:id</text>
</svg>