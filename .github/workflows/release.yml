name: 跨平台多架构打包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（如 v0.2.9_UpDate）'
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            os_name: macos
          # macOS Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            os_name: macos
          # Linux x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            os_name: linux
          # Linux ARM64（交叉编译）
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            os_name: linux

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出指定 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Linux 系统依赖
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gcc-aarch64-linux-gnu

      - name: Linux ARM64 环境变量
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '心愈 ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            跨平台多架构自动构建。
            - macOS: Intel (x64) / Apple Silicon (arm64)
            - Linux: x86_64 / aarch64 (ARM64)
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}'

      - name: 上传产物到 Gitee Releases
        if: ${{ always() }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 上传"
            exit 0
          fi
          TAG_NAME="${TAG}"
          BUNDLE_DIR="src-tauri/target/release/bundle"

          # 找到所有构建产物
          FILES=$(find "$BUNDLE_DIR" -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) 2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "未找到构建产物，跳过 Gitee 上传"
            exit 0
          fi

          echo "找到产物："
          echo "$FILES"

          # 1. 创建或获取 Gitee Release
          RELEASE_ID=$(curl -s -X POST "https://gitee.com/api/v5/repos/yxpil/aisprithill/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"$GITEE_TOKEN\",
              \"tag_name\": \"$TAG_NAME\",
              \"name\": \"心愈 $TAG_NAME\",
              \"body\": \"跨平台多架构自动构建（${{ matrix.target }}）\",
              \"prerelease\": false,
              \"target_commitish\": \"master\"
            }" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")

          # 如果创建失败（可能已存在），查询已有 release
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s "https://gitee.com/api/v5/repos/yxpil/aisprithill/releases/tags/$TAG_NAME?access_token=$GITEE_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "无法创建或获取 Gitee Release"
            exit 1
          fi

          echo "Gitee Release ID: $RELEASE_ID"

          # 2. 逐个上传附件
          for FILE in $FILES; do
            FILENAME=$(basename "$FILE")
            echo "上传 $FILENAME ..."
            curl -s -X POST "https://gitee.com/api/v5/repos/yxpil/aisprithill/releases/$RELEASE_ID/attach_files" \
              -H "Authorization: token $GITEE_TOKEN" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$FILE"
            echo ""
            echo "完成: $FILENAME"
          done
