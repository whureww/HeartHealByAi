name: 跨平台打包发布

# 打 tag v* 时自动触发；也支持手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Intel + Apple Silicon 双架构
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
          # Linux: x86_64（.deb + .AppImage）
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          # Windows: x86_64（.msi + .exe NSIS）
          - platform: windows-latest
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: '心愈 ${{ github.ref_name }}'
          releaseBody: |
            跨平台安装包自动构建。
            - Windows: .msi / .exe
            - macOS: .dmg (Intel / Apple Silicon)
            - Linux: .deb / .AppImage
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
